# Overlay that turns Backstage on for the UI test suite. Layered on top of
# test/e2e/k3d/values-cp.yaml so the default e2e install stays Backstage-off.

backstage:
  enabled: true
  secretName: backstage-secrets
  baseUrl: "http://openchoreo.e2e-cp.local:28080"
  http:
    hostnames:
      - openchoreo.e2e-cp.local
  # Periodic full sync parked at 10 min so the event-driven-sync spec can
  # attribute fast catalog updates to events, not the poll. catalog-sync.spec.ts
  # covers the poll separately (poll-only mode, see reconfigure-poll-mode.setup.ts).
  catalogSync:
    frequency: 600

# Events producer — explicit; the event-driven-sync spec depends on it.
# (Enabled by default in the chart.)
eventForwarder:
  enabled: true
